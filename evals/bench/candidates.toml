# Models in the bake-off. Edit freely; `python -m evals.bench.prices` checks
# every slug exists on OpenRouter and prints live prices before any paid run.
#
# route:    openrouter (default) | anthropic (direct API, needs ANTHROPIC_API_KEY) | stub | jev
# tiers:    which suites the model enters: router, reasoner
# host:     optional OpenRouter host pin (sent with allow_fallbacks=false)
# vision:   true if it can take homework photos (photo suite, optional)
# group:    for the leaderboard; "open" models are guaranteed a finalist slot

[judges]
models = ["anthropic/claude-opus-5.5", "openai/gpt-6.1-sol"]

[[model]]
slug = "stub"
route = "stub"
tiers = ["router", "reasoner"]
group = "floor"

[[model]]
slug = "jev"
route = "jev"
tiers = ["router"]
group = "floor"

# ── Claude ───────────────────────────────────────────────────────────────────
[[model]]
slug = "anthropic/claude-haiku-5.5"
tiers = ["router", "reasoner"]
group = "claude"
vision = true

[[model]]
