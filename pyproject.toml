[project]
name = "katlego"
version = "0.1.0"
description = "Katlego (TutoBuddy) — CAPS-aligned WhatsApp tutor, local proof-of-concept"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "asyncpg>=0.29",
    "anthropic>=0.40",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mockwa", "seed", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
